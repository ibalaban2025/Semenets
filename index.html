<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог меблів — Budova Invest</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --ink:#1c1a17; --muted:#8f8879; --faint:#b9b3a6;
    --accent:#8a6a3c; --accent-dark:#5f4a2a; --border:#eae5db; --hair:#f0ece3;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}

  header{position:sticky;top:0;z-index:20;background:#fff;padding:0 28px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--border);height:76px;}
  .brand{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap;}
  .brand .name{font-family:var(--serif);font-size:21px;letter-spacing:.5px;color:var(--ink);}
  .brand .name em{font-style:normal;color:var(--accent);}
  .brand .sub{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin-top:2px;}
  .search{flex:1;max-width:420px;}
  .search input{width:100%;padding:10px 4px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--ink);font-size:13.5px;font-family:var(--sans);outline:none;transition:border-color .15s;}
  .search input:focus{border-color:var(--ink);}
  .search input::placeholder{color:var(--faint);}
  .cart-btn{margin-left:auto;background:none;color:var(--ink);border:1px solid var(--ink);padding:9px 18px;border-radius:2px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;}
  .cart-btn:hover{background:var(--ink);color:#fff;}

  .layout{display:flex;align-items:flex-start;max-width:1600px;margin:0 auto;}
  nav.cats{position:sticky;top:76px;align-self:flex-start;width:240px;flex-shrink:0;padding:36px 20px 40px 28px;height:calc(100vh - 76px);overflow-y:auto;}
  nav.cats .navlabel{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin-bottom:14px;}
  nav.cats button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:left;padding:9px 2px;border:none;border-bottom:1px solid var(--hair);background:transparent;font-size:13.5px;font-family:var(--sans);cursor:pointer;color:var(--muted);transition:color .12s;}
  nav.cats button:hover{color:var(--ink);}
  nav.cats button.active{color:var(--ink);font-weight:600;border-bottom-color:var(--ink);}
  nav.cats .count{color:var(--faint);font-size:11.5px;font-weight:400;}
  nav.cats button.active .count{color:var(--accent);}

  main{flex:1;padding:32px 32px 90px;min-width:0;}
  .toolbar{display:flex;justify-content:flex-end;align-items:baseline;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
  .toolbar .hint{font-size:12px;color:var(--faint);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:32px 24px;}
  .card{position:relative;cursor:default;}
  .card .thumb{position:relative;overflow:hidden;background:#f4f2ee;}
  .card img{width:100%;display:block;aspect-ratio:970/686;object-fit:cover;cursor:zoom-in;transition:transform .5s ease;}
  .card:hover img{transform:scale(1.035);}
  .card .meta{padding:12px 2px 0;}
  .card .cat-caption{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);}
  .card .series{font-size:14px;color:var(--ink);margin-top:3px;font-family:var(--serif);}
  .card .src{font-size:11px;color:var(--faint);margin-top:4px;}
  .pick{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.9);backdrop-filter:blur(2px);cursor:pointer;font-size:15px;color:var(--ink);opacity:0;transition:opacity .15s,background .15s,color .15s;}
  .card:hover .pick{opacity:1;}
  .card.selected .pick{opacity:1;background:var(--ink);color:#fff;border-color:var(--ink);}
  .empty{padding:80px 0;text-align:center;color:var(--faint);font-family:var(--serif);font-size:15px;}

  /* modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,18,14,.45);z-index:40;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:2px;width:min(900px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;}
  .modal header.m-head{position:static;background:none;color:var(--ink);padding:20px 26px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;box-shadow:none;}
  .modal header.m-head h2{margin:0;font-size:16px;font-weight:400;font-family:var(--serif);}
  .modal header.m-head button{border:none;background:none;font-size:22px;cursor:pointer;color:var(--faint);}
  .modal .m-body{padding:6px 26px;overflow-y:auto;}
  .cart-row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair);}
  .cart-row img{width:76px;height:54px;object-fit:cover;flex-shrink:0;}
  .cart-row .ci{flex:1;font-size:13.5px;font-family:var(--serif);}
  .cart-row .cs{color:var(--faint);font-size:11px;font-family:var(--sans);margin-top:3px;}
  .cart-row button{border:none;background:none;color:#a8493f;cursor:pointer;font-size:12px;letter-spacing:.3px;text-transform:uppercase;}
  .modal footer{padding:18px 26px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
  .modal footer button{padding:10px 18px;border-radius:2px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink);}
  .modal footer button:hover{border-color:var(--ink);}
  .modal footer button.primary{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* lightbox */
  .lightbox{display:none;position:fixed;inset:0;background:rgba(10,9,7,.94);z-index:50;align-items:center;justify-content:center;padding:20px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;}
  .lightbox .lb-close{position:absolute;top:18px;right:24px;color:#fff;font-size:28px;background:none;border:none;cursor:pointer;}
  @media print{
    header,nav.cats,.pick,.toolbar{display:none !important;}
    .grid{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:820px){
    nav.cats{position:static;width:100%;height:auto;display:flex;flex-wrap:wrap;gap:2px 16px;padding:14px 20px;}
    nav.cats .navlabel{display:none;}
    nav.cats button{width:auto;border-bottom:none;padding:6px 0;}
    .layout{flex-direction:column;}
    header{gap:14px;padding:0 16px;}
    .brand .sub{display:none;}
    main{padding:24px 16px 80px;}
  }

  .site-foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--border);padding:12px 32px;box-shadow:0 -2px 10px rgba(0,0,0,.03);}
  .site-foot-inner{max-width:1600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 14px;}
  .site-foot-brand{font-family:var(--serif);font-size:14px;color:var(--ink);}
  .site-foot-brand em{font-style:normal;color:var(--accent);}
  .site-foot-contacts{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .site-foot-contacts a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border);}
  .site-foot-contacts a:hover{color:var(--ink);border-color:var(--ink);}
  .site-foot-loc{color:var(--faint);}
  @media print{ .site-foot{display:none !important;} }
  @media (max-width:820px){
    .site-foot{padding:10px 16px;}
    .site-foot-inner{justify-content:flex-start;gap:6px 14px;}
    .site-foot-brand{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="name">Budova <em>Invest</em></div>
    <div class="sub">Каталог меблів</div>
  </div>
  <div class="search"><input id="searchInput" type="text" placeholder="Пошук за серією, файлом, сторінкою..."></div>
  <button class="cart-btn" id="openCart">Обрано (<span id="cartCount">0</span>)</button>
</header>

<div class="layout">
  <nav class="cats" id="catNav"></nav>
  <main>
    <div class="toolbar">
      <div class="hint">Клік на фото — збільшення · ✓ — додати в добірку</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState" style="display:none;">Нічого не знайдено</div>
  </main>
</div>

<footer class="site-foot">
  <div class="site-foot-inner">
    <div class="site-foot-brand">Budova <em>Invest</em></div>
    <div class="site-foot-contacts">
      <span>Сергій&nbsp;·&nbsp;<a href="tel:+380677711777">+380 67 771 1777</a></span>
      <span>Ольга&nbsp;·&nbsp;<a href="tel:+380674455221">+380 67 445 5221</a></span>
      <span class="site-foot-loc">Ужгород, Україна</span>
    </div>
  </div>
</footer>

<div class="modal-overlay" id="cartModal">
  <div class="modal">
    <header class="m-head">
      <h2>Обрані позиції (<span id="modalCount">0</span>)</h2>
      <button id="closeCart">&times;</button>
    </header>
    <div class="m-body" id="cartList"></div>
    <footer>
      <button id="clearCart">Очистити все</button>
      <button id="printCart">Друк / PDF</button>
      <button class="primary" id="exportCart">Експорт у CSV</button>
    </footer>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <img id="lbImg" src="">
</div>

<script src="data.js"></script>
<script>
const SELECTED_KEY = "budova_selected_items_v1";
let selected = new Set(JSON.parse(localStorage.getItem(SELECTED_KEY) || "[]"));
let activeCat = "all";
let searchTerm = "";

const byId = Object.fromEntries(CATALOG.map(i => [i.id, i]));

function saveSelection(){
  localStorage.setItem(SELECTED_KEY, JSON.stringify([...selected]));
  updateCartCount();
}
function updateCartCount(){
  document.getElementById("cartCount").textContent = selected.size;
  document.getElementById("modalCount").textContent = selected.size;
}

function renderCats(){
  const nav = document.getElementById("catNav");
  const counts = {};
  CATALOG.forEach(i => counts[i.cat] = (counts[i.cat]||0)+1);
  let html = `<div class="navlabel">Категорії</div>`;
  html += `<button data-cat="all" class="${activeCat==='all'?'active':''}">Усі категорії <span class="count">${CATALOG.length}</span></button>`;
  CATEGORIES.forEach(c => {
    html += `<button data-cat="${c.id}" class="${activeCat===c.id?'active':''}">${c.label} <span class="count">${counts[c.id]||0}</span></button>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    activeCat = b.dataset.cat;
    renderCats();
    renderGrid();
  }));
}

function matches(item){
  if(activeCat!=="all" && item.cat!==activeCat) return false;
  if(searchTerm){
    const hay = `${item.series} ${item.src} ${item.page} ${item.catLabel} ${item.label||""}`.toLowerCase();
    if(!hay.includes(searchTerm)) return false;
  }
  return true;
}

function renderGrid(){
  const grid = document.getElementById("grid");
  const list = CATALOG.filter(matches);
  document.getElementById("emptyState").style.display = list.length ? "none" : "block";
  const frag = document.createDocumentFragment();
  grid.innerHTML = "";
  list.forEach(item => {
    const card = document.createElement("div");
    card.className = "card" + (selected.has(item.id) ? " selected" : "");
    card.dataset.id = item.id;
    card.innerHTML = `
      <div class="thumb">
        <img src="${item.img}" loading="lazy" data-id="${item.id}">
        <button class="pick" data-id="${item.id}">${selected.has(item.id) ? "✓" : "+"}</button>
      </div>
      <div class="meta">
        <div class="cat-caption">${item.catLabel}</div>
        <div class="series">${item.series || item.catLabel}</div>
        <div class="src">${item.src} · стор. ${item.page}</div>
      </div>`;
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

document.getElementById("grid").addEventListener("click", (e) => {
  const pick = e.target.closest(".pick");
  if(pick){
    const id = pick.dataset.id;
    if(selected.has(id)) selected.delete(id); else selected.add(id);
    saveSelection();
    const card = pick.closest(".card");
    card.classList.toggle("selected");
    pick.textContent = selected.has(id) ? "✓" : "+";
    return;
  }
  const img = e.target.closest("img");
  if(img){
    document.getElementById("lbImg").src = img.src;
    document.getElementById("lightbox").classList.add("open");
  }
});

document.getElementById("lbClose").addEventListener("click", () => document.getElementById("lightbox").classList.remove("open"));
document.getElementById("lightbox").addEventListener("click", (e) => { if(e.target.id==="lightbox") e.currentTarget.classList.remove("open"); });

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderGrid();
});

function renderCart(){
  const list = document.getElementById("cartList");
  if(selected.size===0){
    list.innerHTML = `<div class="empty">Ще нічого не обрано</div>`;
    return;
  }
  list.innerHTML = [...selected].map(id => {
    const it = byId[id];
    if(!it) return "";
    return `<div class="cart-row">
      <img src="${it.img}">
      <div class="ci">${it.series || it.catLabel}<div class="cs">${it.catLabel} · ${it.src} · стор. ${it.page}</div></div>
      <button data-id="${id}">Прибрати</button>
    </div>`;
  }).join("");
}

document.getElementById("openCart").addEventListener("click", () => {
  renderCart();
  document.getElementById("cartModal").classList.add("open");
});
document.getElementById("closeCart").addEventListener("click", () => document.getElementById("cartModal").classList.remove("open"));
document.getElementById("cartModal").addEventListener("click", (e) => { if(e.target.id==="cartModal") e.currentTarget.classList.remove("open"); });

document.getElementById("cartList").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-id]");
  if(!btn) return;
  selected.delete(btn.dataset.id);
  saveSelection();
  renderCart();
  renderGrid();
});

document.getElementById("clearCart").addEventListener("click", () => {
  if(!confirm("Очистити всю добірку?")) return;
  selected.clear();
  saveSelection();
  renderCart();
  renderGrid();
});

document.getElementById("exportCart").addEventListener("click", () => {
  const rows = [["Категорія","Серія","Файл-джерело","Сторінка","Зображення"]];
  [...selected].forEach(id => {
    const it = byId[id];
    if(it) rows.push([it.catLabel, it.series, it.src, it.page, it.img]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "обрані_меблі.csv";
  a.click();
});

document.getElementById("printCart").addEventListener("click", () => {
  const w = window.open("", "_blank");
  const rowsHtml = [...selected].map(id => {
    const it = byId[id];
    if(!it) return "";
    return `<div style="break-inside:avoid;margin-bottom:16px;">
      <img src="${it.img}" style="width:100%;max-width:600px;border-radius:6px;">
      <div style="font-family:sans-serif;margin-top:4px;"><b>${it.series || it.catLabel}</b><br>
      <span style="color:#666;font-size:13px;">${it.catLabel} · ${it.src} · стор. ${it.page}</span></div>
    </div>`;
  }).join("");
  w.document.write(`<html><head><title>Обрані меблі</title></head><body>${rowsHtml}</body></html>`);
  w.document.close();
  setTimeout(() => w.print(), 400);
});

updateCartCount();
renderCats();
renderGrid();
</script>
</body>
</html>
